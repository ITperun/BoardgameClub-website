version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./config/local.neon:/var/www/html/config/local.neon
    depends_on:
      - db

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mop
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: